name: Check Cloudflare V3.11.55 API readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v31155-cloud.yml
permissions:
  contents: read
jobs:
  cloud-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Production Worker is V3.11.55
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://locphat-pos-sync.locphatpos.workers.dev"
          curl --fail --show-error --silent --max-time 20 "$BASE/health" > "$RUNNER_TEMP/health.json"
          python3 - "$RUNNER_TEMP/health.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['ok'] is True and a['version']=='3.11.55',a
          print('Production Cloud Worker V3.11.55 active')
          PY
          curl --silent --show-error --max-time 15 "$BASE/v1/v311/qr-asset?branch=CN001" -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}' > "$RUNNER_TEMP/code"
          test "$(cat "$RUNNER_TEMP/code")" = "403"
          echo "QR endpoint requires authorization: PASS"
