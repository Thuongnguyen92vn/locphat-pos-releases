name: Verify Production Windows update download (V3.11.55)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-windows-update-v31155.yml
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Cloudflare manifest and executable SHA-256
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows'
          curl --fail --silent --show-error --max-time 20 "$BASE" -o "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['ok'] and d['available'] and d['version']=='3.11.55',d
          assert d['size']==10369024,d
          assert d['sha256'].lower()=='abfcffcb4c8df2b58b08bb89fc9a3b6d9058786ef50457a72179672d1dcfc1f8',d
          assert d['url']=='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows/download?version=3.11.55',d
          print('Production update manifest: OK')
          PY
          curl --fail --location --silent --show-error --retry 2 --max-time 180 \
            "$BASE/download?version=3.11.55" -o "$RUNNER_TEMP/LocPhatPOS_Setup.exe"
          test "$(stat -c%s "$RUNNER_TEMP/LocPhatPOS_Setup.exe")" = 10369024
          echo "abfcffcb4c8df2b58b08bb89fc9a3b6d9058786ef50457a72179672d1dcfc1f8  $RUNNER_TEMP/LocPhatPOS_Setup.exe" | sha256sum --check --status
          echo "Production binary: OK; size and SHA256 verified."
