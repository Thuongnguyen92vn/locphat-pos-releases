name: Publish verified Lộc Phát POS V3.11.68 Windows update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v31168.yml
      - .github/release-requests/v3.11.68.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locphat-release-v31168
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v3.11.68
      ASSET_NAME: LocPhatPOS_V31168_Setup.exe
      EXPECTED_SIZE: "10705408"
      EXPECTED_SHA256: d327994200a45b795e1253ce3d59091691d410059d7e70a40defac52d102f5fd
    steps:
      - uses: actions/checkout@v4
      - name: Create a DRAFT (never advertise an unverified installer)
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target main --draft \
              --title "Lộc Phát POS V3.11.68 TEST" \
              --notes-file .github/release-requests/v3.11.68.txt
          fi
          echo "Release prepared: $RELEASE_TAG"

      - name: Publish ONLY after checking the exact Windows installer
        shell: bash
        run: |
          set -euo pipefail
          # The operator uploaded the verified TEST-named binary to the draft.
          # Safely promote its asset name (without changing bytes) to the exact
          # name expected by the existing Windows updater. Never promote an
          # unverified release: perform size/digest checks before and after.
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET_NAME"; then
            staged="LocPhatPOS_V31168_Setup_TEST.exe"
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$staged"; then
              test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true || { echo "::error::Cannot rename a non-draft release asset"; exit 1; }
              mkdir -p "$RUNNER_TEMP/preflight"
              gh release download "$RELEASE_TAG" --pattern "$staged" --dir "$RUNNER_TEMP/preflight"
              p="$RUNNER_TEMP/preflight/$staged"
              test "$(stat -c %s "$p")" = "$EXPECTED_SIZE" || { echo "::error::Staged asset size mismatch"; exit 1; }
              echo "$EXPECTED_SHA256  $p" | sha256sum --check --status || { echo "::error::Staged asset SHA256 mismatch"; exit 1; }
              asset_id="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "LocPhatPOS_V31168_Setup_TEST.exe") | .id')"
              test -n "$asset_id" || { echo "::error::Staged asset ID not found"; exit 1; }
              gh api --method PATCH "repos/$GH_REPO/releases/assets/$asset_id" -f name="$ASSET_NAME" >/dev/null
              echo "Promoted verified TEST-named asset to updater-compatible $ASSET_NAME"
            else
              echo "::notice::DRAFT only: upload $ASSET_NAME to the release Assets, then re-run this workflow/job."
              echo "No automatic update is announced to other computers until this file is verified."
              exit 0
            fi
          fi
          mkdir -p "$RUNNER_TEMP/installer"
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/installer"
          p="$RUNNER_TEMP/installer/$ASSET_NAME"
          test -f "$p"
          actual_size="$(stat -c %s "$p")"
          test "$actual_size" = "$EXPECTED_SIZE" || { echo "::error::Wrong installer size: $actual_size"; exit 1; }
          actual_sha="$(sha256sum "$p" | cut -d ' ' -f1)"
          test "$actual_sha" = "$EXPECTED_SHA256" || { echo "::error::Windows installer SHA-256 mismatch: $actual_sha"; exit 1; }
          python3 - "$p" <<'PY'
          import sys
          p=sys.argv[1]
          with open(p,'rb') as f:
              if f.read(2)!=b'MZ': raise SystemExit('Not a Windows PE executable (MZ)')
              f.seek(0x3c)
              offset=int.from_bytes(f.read(4),'little')
              f.seek(offset)
              if f.read(4)!=b'PE\x00\x00': raise SystemExit('Missing Windows PE signature')
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          echo "VERIFIED AND PUBLISHED: $RELEASE_TAG, size=$actual_size, sha256=$actual_sha"

      - name: Verify production Cloudflare updater manifest AFTER publication
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [ "$status" != "false" ]; then
            echo "::notice::Still DRAFT: no installer uploaded; production updater intentionally remains unchanged."
            exit 0
          fi
          BASE='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows'
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "$BASE" -o "$RUNNER_TEMP/manifest.json" \
                && python3 - "$RUNNER_TEMP/manifest.json" "$EXPECTED_SIZE" "$EXPECTED_SHA256" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') and d.get('available') and d.get('version')=='3.11.68',d
          assert d.get('size')==int(sys.argv[2]),d
          assert d.get('sha256','').lower()==sys.argv[3],d
          assert d.get('url')=='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows/download?version=3.11.68',d
          print('Production updater MANIFEST confirmed V3.11.68, exact SHA256/size')
          PY
            then
              exit 0
            fi
            echo "Waiting for Cloudflare/GitHub release cache to refresh ($i/24)..."
            sleep 15
          done
          echo "::error::Production updater does not yet advertise verified V3.11.68"
          exit 1
