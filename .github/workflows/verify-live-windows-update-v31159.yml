name: Verify Production Windows update download (V3.11.59)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-windows-update-v31159.yml
      - .github/verify-requests/v3.11.59.txt
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify-live:
    if: ${{ github.event_name != 'release' || github.event.release.tag_name == 'v3.11.59' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Cloudflare live manifest and full EXE checksum
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows'
          for i in 1 2 3 4 5; do
            curl --fail --silent --show-error --max-time 25 "$BASE" -o "$RUNNER_TEMP/manifest.json"
            if python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') and d.get('available') and d.get('version')=='3.11.59', d
          assert d.get('size')==10469376,d
          assert str(d.get('sha256','')).lower()=='4aea2f1f18a4f8acb3342d483f8a487d2db6eac31c5c62626d7e85fba5dfb600',d
          assert d.get('url')=='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows/download?version=3.11.59',d
          print('Live update manifest V3.11.59: PASS')
          PY
            then break;fi
            if [ "$i" = 5 ]; then echo "::error::Live update manifest did not switch to V3.11.59";exit 1;fi
            sleep 12
          done
          curl --fail --location --silent --show-error --retry 2 --max-time 180 \
            "$BASE/download?version=3.11.59" -o "$RUNNER_TEMP/LocPhatPOS_V31159_Setup.exe"
          test "$(stat -c%s "$RUNNER_TEMP/LocPhatPOS_V31159_Setup.exe")" = 10469376
          echo "4aea2f1f18a4f8acb3342d483f8a487d2db6eac31c5c62626d7e85fba5dfb600  $RUNNER_TEMP/LocPhatPOS_V31159_Setup.exe" | sha256sum --check --status
          echo "Cloudflare full EXE V3.11.59: verified size 10469376 and expected SHA256"
