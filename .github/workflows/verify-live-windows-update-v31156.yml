name: Verify Production Windows update download (V3.11.56)
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify-live:
    if: ${{ github.event_name != 'release' || github.event.release.tag_name == 'v3.11.56' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Cloudflare live manifest and full EXE checksum
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows'
          for i in 1 2 3 4 5; do
            curl --fail --silent --show-error --max-time 25 "$BASE" -o "$RUNNER_TEMP/manifest.json"
            if python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') and d.get('available') and d.get('version')=='3.11.56', d
          assert d.get('size')==10406912,d
          assert str(d.get('sha256','')).lower()=='d1861ba8b303489f699cb88d5d3ff97c49c20370020d57ac9f3f5847ec972d31',d
          assert d.get('url')=='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows/download?version=3.11.56',d
          print('Live update manifest V3.11.56: PASS')
          PY
            then break;fi
            if [ "$i" = 5 ]; then echo "::error::Live update manifest did not switch to V3.11.56";exit 1;fi
            sleep 12
          done
          curl --fail --location --silent --show-error --retry 2 --max-time 180 \
            "$BASE/download?version=3.11.56" -o "$RUNNER_TEMP/LocPhatPOS_V31156_Setup.exe"
          test "$(stat -c%s "$RUNNER_TEMP/LocPhatPOS_V31156_Setup.exe")" = 10406912
          echo "d1861ba8b303489f699cb88d5d3ff97c49c20370020d57ac9f3f5847ec972d31  $RUNNER_TEMP/LocPhatPOS_V31156_Setup.exe" | sha256sum --check --status
          echo "Cloudflare full EXE V3.11.56: verified size 10406912 and expected SHA256"
