name: Verify live V3.11.70 Windows automatic update download

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-windows-update-v31170.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows setup through Cloudflare updater and verify all bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows'
          curl --fail --silent --show-error --max-time 25 "$BASE" -o "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') and d.get('available') and d.get('version')=='3.11.70',d
          assert d.get('size')==10732544,d
          assert d.get('sha256','').lower()=='b5b57d062fc07d4075c0effca4646058ab1ed0322df435b929adb4051bf87685',d
          assert d.get('url')=='https://locphat-pos-sync.locphatpos.workers.dev/v1/updates/windows/download?version=3.11.70',d
          print('PASS Production update manifest is V3.11.70 with exact byte count and SHA256')
          PY
          p="$RUNNER_TEMP/LocPhatPOS_V31170_Setup.exe"
          curl --fail --location --silent --show-error --retry 2 --max-time 240 \
            "$BASE/download?version=3.11.70" -o "$p"
          test "$(stat -c%s "$p")" = 10732544 || { echo "::error::Actual download byte length differs"; exit 1; }
          echo "b5b57d062fc07d4075c0effca4646058ab1ed0322df435b929adb4051bf87685  $p" | sha256sum --check --status \
            || { echo "::error::Downloaded Windows installer SHA256 mismatch"; exit 1; }
          python3 - "$p" <<'PY'
          import sys
          with open(sys.argv[1], 'rb') as f:
              assert f.read(2)==b'MZ','Not a Windows executable'
              f.seek(0x3c);i=int.from_bytes(f.read(4),'little')
              f.seek(i);assert f.read(4)==b'PE\x00\x00','Windows PE header missing'
          print('PASS downloaded installer is a Windows PE executable')
          PY
          echo "PASS end-to-end Cloudflare updater download for V3.11.70 (10,705,408 bytes, exact SHA256)"
